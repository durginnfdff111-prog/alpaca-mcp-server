name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Paper API integration tests require an explicit manual action.

jobs:
  # ── Job 1: Core tests (no secrets, no network) ────────────────────────
  # Runs integrity checks and server construction tests on every PR.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run core tests
        run: pytest tests/test_integrity.py tests/test_server_construction.py tests/test_http_security.py tests/test_crash_guard_paper.py

  # ── Job 2: Integration tests (paper API, secrets required) ────────────
  # NEVER send paper orders merely because a PR was opened or code was pushed.
  # Only an explicit workflow_dispatch may use paper credentials.
  #
  # Required GitHub Secrets (Settings > Secrets and variables > Actions):
  #   ALPACA_API_KEY    — paper trading account API key
  #   ALPACA_SECRET_KEY — paper trading account secret key
  test-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run integration tests
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER_TRADE: "true"
        run: pytest tests/ -m integration
